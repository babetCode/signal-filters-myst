version: 1
project:
  title: Signal Filter Guidebook
  authors:
    - name: Adrien Babet
  abstract: An introductory guide to signal filtering.
  license:
    content: CC-BY-4.0
    code: MIT
  # Settings every page inherits. Pages never repeat these (STYLEGUIDE.md §2.2).
  numbering:
    equations: false
  math:
    '\existsin': '\exists #1 \!\!\in\!\! #2\,'
    '\forallin': '\forall #1 \!\!\in\!\! #2\,'
    '\existssubseteq': '\exists #1 \!\!\subseteq\!\! #2\,'
    '\forallsubseteq': '\forall #1 \!\!\subseteq\!\! #2\,'
  # MyST matches each key as a case-sensitive substring, longest key first, so
  # `iff` would also match inside "different" or "Mifflin". A `null` key claims
  # its text first and adds no tooltip. Alphabetical, ignoring case.
  abbreviations:
    ADC: analog-to-digital converter
    AHRS: attitude and heading reference system
    BMR: basal metabolic rate
    CDF: cumulative distribution function
    CLT: central limit theorem
    DEI: daily energy intake
    diff: null
    Diff: null
    EKF: extended Kalman filter
    EMA: exponential moving average
    ENU: east-north-up
    FLU: forward-left-up
    GLRT: generalized likelihood ratio test
    GPS: Global Positioning System
    HDE: heuristic drift elimination
    IEKF: iterated extended Kalman filter
    iff: if and only if
    IMU: inertial measurement unit
    INS: inertial navigation system
    JPL: Jet Propulsion Laboratory
    KF: Kalman filter
    LOTUS: law of the unconscious statistician
    MAP: maximum a posteriori
    MEMS: micro-electro-mechanical systems
    Mifflin: null
    MMSE: minimum mean squared error
    MSE: mean squared error
    NED: north-east-down
    NEES: normalized estimation error squared
    NIS: normalized innovation squared
    ODE: ordinary differential equation
    PDF: probability density function
    PF: particle filter
    PMF: probability mass function
    RK4: classical fourth-order Runge–Kutta method
    RMS: root mean square
    RMSE: root-mean-square error
    RTS: Rauch–Tung–Striebel
    SHOE: stance hypothesis optimal detector
    SPS: samples per second
    TDEE: total daily energy expenditure
    UKF: unscented Kalman filter
    UT: unscented transform
    ZARU: zero angular rate update
    ZFC: Zermelo–Fraenkel set theory with the Axiom of Choice
    ZUPT: zero-velocity update
  plugins:
    - type: executable
      path: ../.venv/bin/jupyter-book-marimo # on Windows, see scripts/link_plugin.py
  toc:
    - file: nb/index.md
    - file: nb/toc.md
    - file: nb/introduction.md
      title: Introduction
    - title: "Part I: Choosing Alpha"
      children:
      - file: nb/ch1_language_of_logic.md
      - file: nb/ch2_axioms_of_set_theory.md
      - file: nb/ch3_sets_for_probability.md
      - file: nb/ch4_probability_spaces.md
      - file: nb/ch5_random_variables.md
      - file: nb/ch6_expectation_and_variance.md
      - file: nb/ch7_optimal_alpha.md
      - file: nb/ch8_bayesian_view.md
    - title: "Part II: The Scalar Kalman Filter"
      children:
        - file: nb/ch9_noise_levels.md
        - file: nb/ch10_process_models.md
        - file: nb/ch11_measurement_functions.md
    - title: "Part III: State Vectors"
      children:
        - file: nb/ch12_vectors_matrices_covariance.md
        - file: nb/ch13_kalman_filter.md
        - file: nb/ch14_kalman_filters_in_practice.md
    - title: "Part IV: Nonlinearity"
      children:
        - file: nb/ch15_extended_kalman_filter.md
        - file: nb/ch16_unscented_kalman_filter.md
    - title: "Part V: Orientation"
      children:
        - file: nb/ch17_rotations.md
        - file: nb/ch18_quaternions.md
        - file: nb/ch19_ahrs.md
    - title: "Part VI: Inertial Navigation for Gait"
      children:
        - file: nb/ch20_strapdown_inertial_navigation.md
        - file: nb/ch21_zero_velocity_updates.md
    - title: "Appendices"
      children:
        - file: nb/appendix_a_formal_logic.md
        - file: nb/appendix_b_number_systems.md
        - file: nb/appendix_c_calculus.md
        - file: nb/appendix_d_linear_algebra.md
    - file: index-terms.md
site:
  template: book-theme
  options:
    favicon: ../static/filter-book-icon.png
    logo: ../static/filter-book-icon.svg
    logo_dark: ../static/filter-book-icon-dark.svg
    logo_text: Signal Filter Guidebook
    hide_authors: true
    style: ./styles.css
