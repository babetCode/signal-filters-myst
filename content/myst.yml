version: 1
project:
  title: Signal Filter Guidebook
  authors:
    - name: Adrien Babet
  abstract: An introductory guide to signal filtering.
  plugins:
    - type: executable
      path: ../.venv/bin/jupyter-book-marimo # on Windows, see scripts/link_plugin.py
  toc:
    - file: nb/index.md
    - file: nb/introduction.md
      title: Introduction
    - title: "Part I: Choosing Alpha"
      children:
      - file: nb/ch1_language_of_logic.md
      - file: nb/ch2_axioms_of_set_theory.md
      - file: nb/ch3_sets_for_probability.md
      - file: nb/ch4_probability_spaces.md
      - file: nb/ch5_random_variables.md
      - file: nb/ch6_expectation_and_variance.md
      - file: nb/ch7_optimal_alpha.md
      - file: nb/ch8_bayesian_view.md
    - title: "Part II: The Scalar Kalman Filter"
      children:
        - file: nb/ch9_noise_levels.md
        - file: nb/ch10_process_models.md
        - file: nb/ch11_measurement_functions.md
    - title: "Part III: State Vectors"
      children:
        - file: nb/ch12_vectors_matrices_covariance.md
        - file: nb/ch13_kalman_filter.md
        - file: nb/ch14_kalman_filters_in_practice.md
    - title: "Part IV: Nonlinearity"
      children:
        - file: nb/ch15_extended_kalman_filter.md
        - file: nb/ch16_unscented_kalman_filter.md
    - title: "Part V: Orientation"
      children:
        - file: nb/ch17_rotations.md
        - file: nb/ch18_quaternions.md
        - file: nb/ch19_ahrs.md
    - title: "Part VI: Inertial Navigation for Gait"
      children:
        - file: nb/ch20_strapdown_inertial_navigation.md
        - file: nb/ch21_zero_velocity_updates.md
    - title: "Appendices"
      children:
        - file: nb/appendix_a_formal_logic.md
        - file: nb/appendix_b_number_systems.md
        - file: nb/appendix_c_calculus.md
        - file: nb/appendix_d_linear_algebra.md
    - file: glossary-terms.md
site:
  template: book-theme
  options:
    favicon: ../static/filter-book-icon.svg
    logo: ../static/filter-book-icon.svg
    logo_text: Signal Filter Guidebook
    hide_authors: true
    style: ../notebooks/notebook-styles.css
