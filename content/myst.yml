version: 1
project:
  title: Signal Filter Book
  authors:
    - name: Adrien Babet
  abstract: An introductory guide to signal filtering.
  plugins:
    - ../scripts/strip-terms.mjs
    - type: executable
      # path: ../.venv/Scripts/jupyter-book-marimo.exe # Windows
      path: ../.venv/bin/jupyter-book-marimo # Unix
  toc:
    - file: index.md
    - file: part01_introduction.md
    - file: part02_alpha_beta_filter.md
    - file: part03_optimal_filtering.md
    - file: glossary-terms.md
    - file: philosophy/philosophy.md
      hidden: true
    - file: philosophy/glossary-philosophy.md
      hidden: true
  exports:
    - format: typst
      output: documents/project-download.pdf
      articles:
        - index.md
        - part01_introduction.md
        - part02_alpha_beta_filter.md
        - part03_optimal_filtering.md
site:
  template: book-theme
  options:
    favicon: ../assets/filter-book-icon.svg
    logo: ../assets/filter-book-icon.svg
    logo_text: Signal Filters
