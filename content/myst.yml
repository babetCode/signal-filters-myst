version: 1
project:
  title: Signal Filter Guidebook
  authors:
    - name: Adrien Babet
  abstract: An introductory guide to signal filtering.
  plugins:
    # - ../scripts/strip-terms.mjs
    - type: executable
      path: ../.venv/Scripts/jupyter-book-marimo.exe # Windows
      # path: ../.venv/bin/jupyter-book-marimo # Unix
  toc:
    - file: index.md
    - file: introduction.md
      title: Introduction
    - file: part1_mathematical_foundations.md
      children:
      - file: part1_ch1_language_of_logic.md
      - file: part1_ch2_zfc_axioms.md
      - file: part1_ch3_numbers_probabilities.md
    - file: glossary-terms.md
site:
  template: book-theme
  options:
    favicon: ../static/filter-book-icon.svg
    logo: ../static/filter-book-icon.svg
    logo_text: Signal Filter Guidebook
    hide_authors: true
    style: ../notebooks/notebook-styles.css
