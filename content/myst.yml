        - file: nb/ch21_zero_velocity_updates_v2.md
    - title: "Appendices"
      children:
        - file: nb/appendix_a_formal_logic_v2.md
        - file: nb/appendix_b_number_systems_v2.md
        - file: nb/appendix_c_calculus_v2.md
